[package]
name = "beam-editor-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
beam-media-manifest = { path = "../media-manifest" }
beam-screen = { path = "../screen" }
gst = { package = "gstreamer", version = "0.25", features = ["v1_24"] }
ges = { package = "gstreamer-editing-services", version = "0.25", features = ["v1_24"] }
gst_base = { package = "gstreamer-base", version = "0.25", features = ["v1_24"] }
gst_app = { package = "gstreamer-app", version = "0.25", features = ["v1_24"] }
gst_gl = { package = "gstreamer-gl", version = "0.25", features = ["v1_24"] }
gst_video = { package = "gstreamer-video", version = "0.25", features = ["v1_24"] }
gst_pbutils = { package = "gstreamer-pbutils", version = "0.25", features = ["v1_24"] }
gst_controller = { package = "gstreamer-controller", version = "0.25" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
fs2 = "0.4"
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gst_allocators = { package = "gstreamer-allocators", version = "0.25", features = ["v1_24"] }

[dev-dependencies]

[[test]]
name = "editor"
path = "test/lib.rs"

[lints.clippy]
all = "deny"
