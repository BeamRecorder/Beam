[package]
name = "beam-editor-domain"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
beam-media-manifest = { path = "../media-manifest" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = { version = "0.8.22", features = ["uuid1"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
fs2 = "0.4"
sha2 = "0.10"
tempfile = "3"

[[test]]
name = "domain"
path = "test/lib.rs"

[[test]]
name = "protocol"
path = "test/protocol/mod.rs"

[[test]]
name = "collections"
path = "test/collections/mod.rs"

[lints.clippy]
all = "deny"

[[example]]
name = "editor-contracts"
path = "../../scripts/editor/schema.rs"
