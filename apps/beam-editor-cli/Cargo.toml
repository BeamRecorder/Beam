[package]
name = "beam-editor-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[[bin]]
name = "beam-editor"
path = "src/main.rs"

[dependencies]
beam-editor-domain = { path = "../../packages/editor-domain" }
beam-editor-engine = { path = "../../packages/editor-engine" }
beam-editor-mcp = { path = "../beam-editor-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "cli"
path = "test/lib.rs"

[lints.clippy]
all = "deny"
