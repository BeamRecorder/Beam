<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111110" />
    <link rel="icon" type="image/webp" sizes="96x96" href="/favicon.webp" />
    <script>
      (() => {
        try {
          const root = document.documentElement;
          const stored = localStorage.getItem('beam-website-theme');
          const preference = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          const dark =
            preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          root.dataset.theme = preference;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';

          const locales = [
            'en',
            'fr',
            'es',
            'de',
            'ru',
            'bg',
            'zh-CN',
            'ko',
            'pt-BR',
            'ja',
            'it',
            'pl',
            'zh-TW',
            'hi',
            'vi',
          ];
          const storedLocale = localStorage.getItem('locale');
          const languages = navigator.languages?.length ? navigator.languages : [navigator.language];
          const normalizeLocale = (language) => {
            const value = language.toLowerCase();
            const candidate =
              value.startsWith('zh-tw') || value.startsWith('zh-hk')
                ? 'zh-TW'
                : value.startsWith('zh')
                  ? 'zh-CN'
                  : value.startsWith('pt-br')
                    ? 'pt-BR'
                    : value.split('-')[0];
            return locales.includes(candidate) ? candidate : null;
          };
          const locale = locales.includes(storedLocale)
            ? storedLocale
            : languages.map(normalizeLocale).find(Boolean) || 'en';
          if (locale !== 'en') root.dataset.localePending = '';
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
