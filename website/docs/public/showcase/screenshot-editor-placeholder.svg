<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Beam Screenshot Editor placeholder</title>
  <desc id="desc">A stylized placeholder showing the Screenshot Editor layout until a final product capture is supplied.</desc>
