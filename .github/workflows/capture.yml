name: capture
on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libpipewire-0.3-dev libspa-0.2-dev libasound2-dev libudev-dev
      - run: cargo fmt --all --check
      - run: cargo check -p capture --all-targets --all-features
      - run: cargo test -p capture --all-features
      - run: cargo clippy -p capture --all-targets --all-features -- -D warnings
      - run: cargo doc -p capture --all-features --no-deps
