name: Release

env:
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  electron_config_cache: ${{ github.workspace }}/.cache/electron

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  native-runtimes:
    needs: prepare
    uses: ./.github/workflows/native-runtime.yml

  prepare:
    if: >-
      github.actor == 'ExtraBinoss' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[RELEASE]'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          latest_tag="$(gh release list --limit 100 --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName' | head -n 1)"
          node --input-type=module - "$version" "$latest_tag" <<'NODE'
          const [version, latestTag] = process.argv.slice(2)
          const parse = (value) => {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(value.replace(/^v/, ''))
            if (!match) throw new Error(`Expected a stable semantic version, received "${value}".`)
            return match.slice(1).map(Number)
          }
          const current = parse(version)
          if (latestTag) {
            const latest = parse(latestTag)
            const comparison = current.findIndex((part, index) => part !== latest[index])
            if (comparison < 0 || current[comparison] <= latest[comparison]) {
              throw new Error(`package.json is ${version}; it must be greater than the latest release (${latestTag}).`)
            }
          }
          NODE
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package-windows:
    needs: [prepare, native-runtimes]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: media-runtime-win-*
          path: native-runtime-artifacts
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Cache Electron packaging binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_BUILDER_CACHE }}
            ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-${{ runner.arch }}-electron-builder-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-electron-builder-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-package-windows-x64-arm64-release
          cache-on-failure: true
      - run: node scripts/ci/bun-install-retry.cjs
      - run: node scripts/native/artifacts.cjs restore --input native-runtime-artifacts
      - run: bunx vite build
      - run: bunx electron-builder --win nsis --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/native/artifacts.cjs collect --output dist_native
      - name: Verify payload architectures, metadata, installer selection, and engine smoke
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          node scripts/release/verify-pe.cjs x64 "build/native/win/x64/beam-media-engine-$version.exe" "dist_electron/win-unpacked/Beam.exe" "dist_electron/win-unpacked/resources/media-runtime/bin/beam-media-engine.exe"
          node scripts/release/verify-pe.cjs arm64 "build/native/win/arm64/beam-media-engine-$version.exe" "dist_electron/win-arm64-unpacked/Beam.exe" "dist_electron/win-arm64-unpacked/resources/media-runtime/bin/beam-media-engine.exe"
          node scripts/release/artifacts.cjs metadata dist_electron latest.yml
          $installer = Get-ChildItem dist_electron -Filter '*.exe' | Where-Object Name -Like '*Setup*' | Select-Object -First 1
          $listing = & 7z l $installer.FullName | Out-String
          if ($listing -notmatch 'app-64\.7z' -or $listing -notmatch 'app-arm64\.7z') { throw 'Universal NSIS payloads are missing' }
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          node scripts/release/verify-pe.cjs x64 (Join-Path $env:LOCALAPPDATA 'Programs/Beam/Beam.exe')
          $engine = "build/native/win/x64/media-runtime/run-engine.cmd"
          $response = '{"id":"release-status","version":1,"command":{"type":"status"}}' | & $engine (Join-Path $env:RUNNER_TEMP 'beam-smoke-projects') | Select-Object -First 1 | ConvertFrom-Json
          if (-not $response.ok) { throw 'x64 beam-media-engine status smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            dist_electron/*.exe
            dist_electron/*.blockmap
            dist_electron/latest.yml
            dist_native/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-smoke-payload
          path: |
            dist_electron/win-arm64-unpacked/Beam.exe
            dist_electron/win-arm64-unpacked/resources/media-runtime/**
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  smoke-windows-arm64:
    needs: [prepare, package-windows]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: windows-arm64-smoke-payload
          path: windows-arm64-payload
      - name: Smoke the packaged ARM64 application payload
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $application = Get-ChildItem windows-arm64-payload -Recurse -File -Filter 'Beam.exe' | Select-Object -First 1
          $engine = Get-ChildItem windows-arm64-payload -Recurse -File -Filter "beam-media-engine.exe" | Select-Object -First 1
          if (-not $application -or -not $engine) { throw 'ARM64 smoke payload is incomplete' }
          node scripts/release/verify-pe.cjs arm64 $application.FullName $engine.FullName
          $response = '{"id":"release-status","version":1,"command":{"type":"status"}}' | & (Join-Path $engine.Directory.Parent.FullName 'run-engine.cmd') (Join-Path $env:RUNNER_TEMP 'beam-smoke-projects') | Select-Object -First 1 | ConvertFrom-Json
          if (-not $response.ok) { throw 'ARM64 beam-media-engine status smoke failed' }

  package-macos:
    needs: [prepare, native-runtimes]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: media-runtime-mac-*
          path: native-runtime-artifacts
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Cache Electron packaging binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_BUILDER_CACHE }}
            ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-${{ runner.arch }}-electron-builder-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-electron-builder-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-package-macos-aarch64-apple-darwin-release
          cache-on-failure: true
      - run: node scripts/ci/bun-install-retry.cjs
      - run: node scripts/native/artifacts.cjs restore --input native-runtime-artifacts
      - run: bunx vite build
      - run: bunx electron-builder --mac dmg zip --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Archive complete macOS applications for native updates
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          COPYFILE_DISABLE=1 tar -czf "dist_electron/Beam-$version-mac-x64.app.tar.gz" -C dist_electron/mac Beam.app
          COPYFILE_DISABLE=1 tar -czf "dist_electron/Beam-$version-mac-arm64.app.tar.gz" -C dist_electron/mac-arm64 Beam.app
      - run: node scripts/native/artifacts.cjs collect --output dist_native
      - name: Verify packaged engine and metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          for entry in 'mac:x86_64' 'mac-arm64:arm64'; do
            directory="${entry%%:*}"
            architecture="${entry##*:}"
            packaged="dist_electron/$directory/Beam.app/Contents/Resources/media-runtime/bin/beam-media-engine"
            test -f "$packaged"
            file "$packaged" | grep "$architecture"
          done
          otool -L "$packaged"
          node scripts/release/artifacts.cjs metadata dist_electron latest-mac.yml
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/*.app.tar.gz
            dist_electron/*.blockmap
            dist_electron/latest-mac.yml
            dist_native/*
          if-no-files-found: error
          retention-days: 1

  package-linux:
    needs: [prepare, native-runtimes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: media-runtime-linux-*
          path: native-runtime-artifacts
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Cache Electron packaging binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_BUILDER_CACHE }}
            ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-${{ runner.arch }}-electron-builder-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-electron-builder-
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-package-linux-x86_64-unknown-linux-gnu-release
          cache-on-failure: true
      - name: Install Linux build and inspection dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev libpipewire-0.3-dev libasound2-dev libudev-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good pkg-config rpm
      - run: node scripts/ci/bun-install-retry.cjs
      - run: node scripts/native/artifacts.cjs restore --input native-runtime-artifacts
      - run: bunx vite build
      - run: bunx vite build
      - run: bunx electron-builder --linux AppImage deb rpm --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/native/artifacts.cjs collect --output dist_native
      - name: Inspect packages, bundled binaries, package markers, and metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          appimage="$(find dist_electron -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          deb="$(find dist_electron -maxdepth 1 -type f -name '*.deb' -print -quit)"
          rpm_package="$(find dist_electron -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          chmod +x "$appimage"
          (cd dist_electron && "./$(basename "$appimage")" --appimage-extract >/dev/null)
          packaged_engine="$(find dist_electron/squashfs-root -type f -path "*/resources/media-runtime/bin/beam-media-engine" -print -quit)"
          packaged_helper="$(find dist_electron/squashfs-root -type f -path "*/resources/input-helper/beam-input-helper-$version" -print -quit)"
          test -x "$packaged_engine"
          test -x "$packaged_helper"
          dpkg-deb --contents "$deb" | grep 'resources/package-type'
          rpm --query --package --list "$rpm_package" | grep 'resources/package-type'
          node scripts/release/artifacts.cjs metadata dist_electron latest-linux.yml
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: |
            dist_electron/*.AppImage
            dist_electron/*.deb
            dist_electron/*.rpm
            dist_electron/*.blockmap
            dist_electron/latest-linux.yml
            dist_native/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, package-windows, smoke-windows-arm64, package-macos, package-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install artifact inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes p7zip-full rpm
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release-assets'
          path: release-assets
          merge-multiple: true
      - name: Flatten downloaded release assets
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' asset; do
            destination="release-assets/$(basename "$asset")"
            if [[ -e "$destination" ]]; then
              echo "Duplicate release asset: $(basename "$asset")" >&2
              exit 1
            fi
            mv "$asset" "$destination"
          done < <(find release-assets -mindepth 2 -type f -print0)
          find release-assets -mindepth 1 -type d -empty -delete
          if find release-assets -mindepth 2 -type f -print -quit | grep -q .; then
            echo 'Nested release assets remain after flattening' >&2
            exit 1
          fi
      - name: Create or reuse the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --draft
          fi
      - name: Generate, upload, and re-download every draft asset before validation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/artifacts.cjs generate-native release-assets
          node scripts/release/native-updates.cjs generate release-assets "$TAG"
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          mkdir uploaded-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir uploaded-assets
          node scripts/release/artifacts.cjs release uploaded-assets
          node scripts/release/native-updates.cjs validate uploaded-assets "$TAG"
          diff \
            <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort) \
            <(find uploaded-assets -maxdepth 1 -type f -printf '%f\n' | sort)
      - name: Publish the complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Verify public auto-update metadata and every referenced asset
        env:
          TAG: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          node scripts/release/download.cjs "$base" post-release-assets
          node scripts/release/artifacts.cjs metadata post-release-assets latest.yml
          node scripts/release/artifacts.cjs metadata post-release-assets latest-linux.yml
          node scripts/release/artifacts.cjs metadata post-release-assets latest-mac.yml
          node scripts/release/native-updates.cjs verify-published post-native-update-assets "$TAG"
