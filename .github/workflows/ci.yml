name: CI

env:
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  electron_config_cache: ${{ github.workspace }}/.cache/electron

on:
  pull_request:
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  native-runtimes:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    uses: ./.github/workflows/native-runtime.yml

  changes:
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            packaging:
              - '.github/workflows/**'
              - 'build/**'
              - 'bun.lock'
              - 'Cargo.*'
              - 'electron/**'
              - 'packages/**'
              - 'package*.json'
              - 'public/**'
              - 'rust-toolchain.toml'
              - 'scripts/**'
              - 'src/**'
              - 'test/**'
              - 'tests/**'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - '*.html'

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-quality-linux
          cache-on-failure: true
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev libpipewire-0.3-dev pipewire libasound2-dev libudev-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good pkg-config
      - run: node scripts/ci/bun-install-retry.cjs
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run typecheck:vue
      - run: bun run test
      # - run: bun run test:coverage
      - run: cargo fmt --all --check
      - run: cargo nextest run -p beam-screen -p beam-media-engine
      - run: cargo clippy -p beam-screen -p beam-media-engine --all-targets -- -D warnings

  package-linux:
    needs: [changes, native-runtimes]
    if: >-
      needs.changes.outputs.packaging == 'true' &&
      (github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message || '', '[RELEASE]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: media-runtime-linux-*
          path: native-runtime-artifacts
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Cache Electron packaging binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_BUILDER_CACHE }}
            ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-${{ runner.arch }}-electron-builder-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-electron-builder-
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-package-linux-x86_64-unknown-linux-gnu-release
          cache-on-failure: true
      - name: Install Linux build, runtime, and inspection dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang cpio libclang-dev libpipewire-0.3-dev \
            p7zip-full pipewire pkg-config rpm wireplumber \
            xdg-desktop-portal xdg-desktop-portal-gnome
      - run: node scripts/ci/bun-install-retry.cjs
      - run: node scripts/native/artifacts.cjs restore --input native-runtime-artifacts
      - run: bunx vite build
      - run: bunx vite build
      - run: bunx electron-builder --linux AppImage deb rpm --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/native/artifacts.cjs collect --output dist_native
      - name: Inspect Linux packages and update metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          appimage="$(find dist_electron -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          deb="$(find dist_electron -maxdepth 1 -type f -name '*.deb' -print -quit)"
          rpm_package="$(find dist_electron -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$appimage" && test -n "$deb" && test -n "$rpm_package"
          chmod +x "$appimage"
          (cd dist_electron && "./$(basename "$appimage")" --appimage-extract >/dev/null)
          packaged_engine="$(find dist_electron/squashfs-root -type f -path "*/resources/media-runtime/bin/beam-media-engine" -print -quit)"
          packaged_helper="$(find dist_electron/squashfs-root -type f -path "*/resources/input-helper/beam-input-helper-$version" -print -quit)"
          test -x "$packaged_engine"
          test -x "$packaged_helper"
          dpkg-deb --contents "$deb" | grep "resources/media-runtime/bin/beam-media-engine"
          dpkg-deb --contents "$deb" | grep 'resources/package-type'
          rpm --query --package --list "$rpm_package" | grep "resources/media-runtime/bin/beam-media-engine"
          rpm --query --package --list "$rpm_package" | grep 'resources/package-type'
          sudo apt-get install --yes "./$deb"
          test -x /usr/libexec/beam-input-helper
          test -f /usr/share/polkit-1/actions/com.beam.input-monitor.policy
          node scripts/release/artifacts.cjs metadata dist_electron latest-linux.yml
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: linux-ci-packages
          path: |
            dist_electron/*.AppImage
            dist_electron/*.deb
            dist_electron/*.rpm
            dist_electron/*.blockmap
            dist_electron/latest-linux.yml
            dist_native/*
          if-no-files-found: error
          retention-days: 5

  package-windows:
    needs: [changes, native-runtimes]
    if: >-
      needs.changes.outputs.packaging == 'true' &&
      (github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message || '', '[RELEASE]'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: media-runtime-win-*
          path: native-runtime-artifacts
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Cache Electron packaging binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_BUILDER_CACHE }}
            ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-${{ runner.arch }}-electron-builder-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-electron-builder-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-package-windows-x64-arm64-release
          cache-on-failure: true
      - run: node scripts/ci/bun-install-retry.cjs
      - run: node scripts/native/artifacts.cjs restore --input native-runtime-artifacts
      - run: bunx vite build
      - run: bunx electron-builder --win nsis --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/native/artifacts.cjs collect --output dist_native
      - name: Verify universal installer and x64 payload
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          node scripts/release/verify-pe.cjs x64 "build/native/win/x64/beam-media-engine-$version.exe" "dist_electron/win-unpacked/Beam.exe" "dist_electron/win-unpacked/resources/media-runtime/bin/beam-media-engine.exe"
          node scripts/release/verify-pe.cjs arm64 "build/native/win/arm64/beam-media-engine-$version.exe" "dist_electron/win-arm64-unpacked/Beam.exe" "dist_electron/win-arm64-unpacked/resources/media-runtime/bin/beam-media-engine.exe"
          node scripts/release/artifacts.cjs metadata dist_electron latest.yml
          $installer = Get-ChildItem dist_electron -Filter '*.exe' | Where-Object Name -Like '*Setup*' | Select-Object -First 1
          $listing = & 7z l $installer.FullName | Out-String
          if ($listing -notmatch 'app-64\.7z' -or $listing -notmatch 'app-arm64\.7z') { throw 'Universal NSIS payloads are missing' }
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/Beam/Beam.exe'
          node scripts/release/verify-pe.cjs x64 $installed
          $engine = "build/native/win/x64/media-runtime/run-engine.cmd"
          $response = '{"id":"ci-status","version":1,"command":{"type":"status"}}' | & $engine (Join-Path $env:RUNNER_TEMP 'beam-smoke-projects') | Select-Object -First 1 | ConvertFrom-Json
          if (-not $response.ok) { throw 'x64 beam-media-engine status smoke failed' }
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: windows-universal-ci
          path: |
            dist_electron/*.exe
            dist_electron/*.blockmap
            dist_electron/latest.yml
            dist_native/*
          if-no-files-found: error
          retention-days: 5
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-smoke-payload
          path: |
            dist_electron/win-arm64-unpacked/Beam.exe
            dist_electron/win-arm64-unpacked/resources/media-runtime/**
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

  smoke-windows-arm64:
    needs: [changes, package-windows]
    if: >-
      needs.changes.outputs.packaging == 'true' &&
      needs.package-windows.result == 'success' &&
      (github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message || '', '[RELEASE]'))
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: windows-arm64-smoke-payload
          path: windows-arm64-payload
      - name: Smoke the packaged ARM64 application payload
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $application = Get-ChildItem windows-arm64-payload -Recurse -File -Filter 'Beam.exe' | Select-Object -First 1
          $engine = Get-ChildItem windows-arm64-payload -Recurse -File -Filter "beam-media-engine.exe" | Select-Object -First 1
          if (-not $application -or -not $engine) { throw 'ARM64 smoke payload is incomplete' }
          node scripts/release/verify-pe.cjs arm64 $application.FullName $engine.FullName
          $response = '{"id":"ci-status","version":1,"command":{"type":"status"}}' | & (Join-Path $engine.Directory.Parent.FullName 'run-engine.cmd') (Join-Path $env:RUNNER_TEMP 'beam-smoke-projects') | Select-Object -First 1 | ConvertFrom-Json
          if (-not $response.ok) { throw 'ARM64 beam-media-engine status smoke failed' }

  package-macos-arm64:
    needs: [changes, native-runtimes]
    if: >-
      needs.changes.outputs.packaging == 'true' &&
      (github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message || '', '[RELEASE]'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: media-runtime-mac-*
          path: native-runtime-artifacts
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Cache Electron packaging binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_BUILDER_CACHE }}
            ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-${{ runner.arch }}-electron-builder-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-electron-builder-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-package-macos-aarch64-apple-darwin-release
          cache-on-failure: true
      - run: node scripts/ci/bun-install-retry.cjs
      - run: node scripts/native/artifacts.cjs restore --input native-runtime-artifacts
      - run: bunx vite build
      - run: bunx electron-builder --mac dmg zip --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/native/artifacts.cjs collect --output dist_native
      - name: Verify both macOS payloads and metadata
        run: |
          version="$(node -p "require('./package.json').version")"
          for entry in 'mac:x86_64' 'mac-arm64:arm64'; do
            directory="${entry%%:*}"
            architecture="${entry##*:}"
            packaged="dist_electron/$directory/Beam.app/Contents/Resources/media-runtime/bin/beam-media-engine"
            test -f "$packaged"
            file "$packaged" | grep "$architecture"
          done
          node scripts/release/artifacts.cjs metadata dist_electron latest-mac.yml
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: macos-arm64-ci-packages
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/*.blockmap
            dist_electron/latest-mac.yml
            dist_native/*
          if-no-files-found: error
          retention-days: 5
