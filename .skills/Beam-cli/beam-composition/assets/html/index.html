<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beam composition</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      body { display: grid; place-items: center; font-family: sans-serif; color: #f7f5f0; }
      .card { width: 80%; padding: 7%; border-radius: 32px; background: #20211f; }
      .eyebrow { margin: 0 0 24px; font-size: 20px; color: #b6b9b0; }
      h1 { margin: 0; max-width: 15ch; font-size: clamp(32px, 5vw, 72px); line-height: 1.05; letter-spacing: -0.04em; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">BEAM</p>
      <h1>Your idea, in motion.</h1>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
